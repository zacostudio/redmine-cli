[package]
name = "redmine-cli"
version = "0.4.2"
edition = "2021"
rust-version = "1.85"
description = "Standalone CLI for Redmine"
license = "MIT"
repository = "https://github.com/zacostudio/redmine-cli"
readme = "README.md"

[[bin]]
name = "redmine"
path = "src/main.rs"

[lib]
name = "redmine_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Redmine client·타입은 Tome 과 같이 쓰는 사내 crate 에 있다 (Tome #762). TLS 는 지금처럼 rustls.
redmine-services = { version = "=0.1.0", registry = "kellnr", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
thiserror = "1"
serde_norway = "0.9.42"

[dev-dependencies]
assert_cmd = "2"
wiremock = "0.6"
predicates = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
