[package]
name = "redmine-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
description = "Standalone CLI for Redmine"
license = "MIT"
repository = "https://github.com/zacostudio/redmine-cli"
readme = "README.md"

[[bin]]
name = "redmine"
path = "src/main.rs"

[lib]
name = "redmine_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# config.toml -> config.yml 1회 자동 변환에서 legacy 파일을 읽는 용도로만 남는다.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
directories = "6"
urlencoding = "2"
libc = "0.2"
thiserror = "1"
serde_norway = "0.9.42"

[dev-dependencies]
assert_cmd = "2"
wiremock = "0.6"
predicates = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
