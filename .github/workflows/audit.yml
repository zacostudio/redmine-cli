# Cargo.lock 의존성을 RustSec advisory DB 와 매주/PR 마다 대조한다.
name: Security Audit

on:
  push:
    branches: [main, master]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  # 의존성 변경이 없어도 advisory DB 가 갱신되면 새 취약점이 노출될 수 있으므로
  # 매주 월요일 09:00 UTC (KST 18:00) 정기 검사한다.
  schedule:
    - cron: "0 9 * * 1"
  # 수동 트리거도 허용.
  workflow_dispatch:

# 동시에 같은 ref 의 audit 가 여러 번 돌지 않도록 한다.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      # scheduled 실행에서 취약점 발견 시 자동으로 issue 를 만든다.
      issues: write
      contents: read
      # PR 컨텍스트에서 GitHub Checks API 에 결과를 보고하기 위해 필요.
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
